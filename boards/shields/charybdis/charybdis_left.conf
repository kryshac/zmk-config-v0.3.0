CONFIG_INPUT=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

CONFIG_LED_STRIP=y
# Zephyr 4.1 split WS2812_STRIP into per-transport symbols that auto-enable
# from the devicetree "worldsemi,ws2812-spi" node.
CONFIG_ZMK_RGB_UNDERGLOW=y
# Keep EXT_POWER dedicated to peripherals such as the PMW3610. ZMK defaults this
# to y for RGB, but RGB idle/off would otherwise shut down the trackball rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=110
